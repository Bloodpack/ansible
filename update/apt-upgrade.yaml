- name: Update Linux Servers
  hosts: all
  become: true

  vars_files:
    - /root/secrets.yml

  vars:
    reboot_after_update: true
    apt_cache_valid_time: 3600
    reboot_timeout: 600

  tasks:

    # Initialize status variables
    - name: Initialize update status
      ansible.builtin.set_fact:
        update_failed: false
        reboot_failed: false
        reboot_performed: false

    # Update system packages
    - name: Update system packages
      block:

        - name: Update apt package cache and upgrade packages
          ansible.builtin.apt:
            force_apt_get: true
            upgrade: yes
            update_cache: true
            cache_valid_time: "{{ apt_cache_valid_time }}"
          register: update_result

        - name: Remove dependencies that are no longer required
          ansible.builtin.apt:
            autoremove: true
          register: autoremove_result

      rescue:

        - name: Register update failure
          ansible.builtin.set_fact:
            update_failed: true
            update_error: "{{ ansible_failed_result.msg | default(ansible_failed_result | string) }}"

    # Check if a reboot is required
    - name: Check if a reboot is required
      ansible.builtin.stat:
        path: /var/run/reboot-required
      register: reboot_required

    # Check packages on hold
    - name: Check for packages on hold
      ansible.builtin.command: apt-mark showhold
      register: held_back_updates
      changed_when: false

    # Automatically reboot if required
    - name: Reboot server if required
      block:

        - name: Perform automatic reboot
          ansible.builtin.reboot:
            reboot_timeout: "{{ reboot_timeout }}"
            post_reboot_delay: 10
            msg: "Automatic reboot initiated by Ansible after system updates."
          register: reboot_result

        - name: Register successful reboot
          ansible.builtin.set_fact:
            reboot_performed: true

      rescue:

        - name: Register reboot failure
          ansible.builtin.set_fact:
            reboot_failed: true
            reboot_error: "{{ ansible_failed_result.msg | default(ansible_failed_result | string) }}"

      when:
        - reboot_required.stat.exists
        - reboot_after_update | bool
        - not update_failed
        - not ansible_check_mode

    # Determine whether packages were changed
    - name: Determine update status
      ansible.builtin.set_fact:
        updates_changed: >-
          {{
            (update_result.changed | default(false))
            or
            (autoremove_result.changed | default(false))
          }}

    # Create combined Telegram notification
    - name: Create combined Telegram notification
      ansible.builtin.set_fact:
        notification_message: |
          🖥️ {{ ansible_facts['hostname'] }}

          {% if update_failed | bool %}
          ❌ Update process failed!
          Error: {{ update_error | default('Unknown error') }}
          {% elif updates_changed | bool %}
          ✅ Update process completed successfully.
          {% else %}
          ℹ️ No updates are available.
          {% endif %}
          {% if held_back_updates.stdout | default('') | trim | length > 0 %}
          ⚠️ Packages on hold:
          {{ held_back_updates.stdout | trim }}
          {% endif %}
          {% if reboot_performed | bool %}
          🔄 Server rebooted successfully.
          {% elif reboot_failed | bool %}
          ❌ Automatic reboot failed!
          Error: {{ reboot_error | default('Unknown error') }}
          {% elif reboot_required.stat.exists | default(false) %}
          🔄 Reboot is required.
          {% endif %}

    # Send one combined Telegram notification
    - name: Send combined notification to Telegram
      ansible.builtin.uri:
        url: "https://api.telegram.org/bot{{ telegram_token }}/sendMessage"
        method: POST
        body_format: json
        body:
          chat_id: "{{ chat_id }}"
          text: "{{ notification_message }}"
        return_content: true
        status_code:
          - 200
      register: telegram_response
      failed_when: >-
        not (telegram_response.json.ok | default(false))
      when: not ansible_check_mode

    # Report failures to Ansible Semaphore
    - name: Report update or reboot failure
      ansible.builtin.fail:
        msg: >-
          {% if update_failed | bool %}
          System update failed: {{ update_error | default('Unknown error') }}
          {% else %}
          Automatic reboot failed: {{ reboot_error | default('Unknown error') }}
          {% endif %}
      when: update_failed | bool or reboot_failed | bool
